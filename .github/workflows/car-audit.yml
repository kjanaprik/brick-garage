name: Brick Garage car audit

# Weekly (and on-demand) check for new LEGO car sets. AUTO-COMMIT mode: new sets
# that pass the car filters and aren't in ignore-skus.json are appended to
# index.html's CATALOG and committed, so the Pages site self-updates.
# ignore-skus.json is the veto list — put anything you DON'T want in there.

on:
  schedule:
    - cron: '0 8 * * 1'        # Mondays 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write               # to commit the updated index.html

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run car audit (apply)
        id: audit
        env:
          AUDIT_APPLY: '1'        # write new sets into index.html
        run: node audit-cars.mjs

      - name: Add report to job summary
        if: always()
        run: cat audit-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit new sets
        if: always()
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo "No catalog changes — nothing to commit."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Auto-add ${{ steps.audit.outputs.new_count }} new car set(s) from audit"
            git push
            echo "Committed ${{ steps.audit.outputs.new_count }} new set(s)."
          fi
