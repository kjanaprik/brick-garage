<!--
  Brick Garage — LEGO Collection Tracker
  With smart theme detection for Technic, Speed Champions, Icons, Architecture,
  Batman, Racers, Jurassic Park, Ideas, and Artworks.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brick Garage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@300;400;500;600;700&family=Saira+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0E1318;
    --surface: #161D25;
    --surface-2: #1D2731;
    --surface-3: #243039;
    --border: #2A3641;
    --border-bright: #38495880;
    --text: #E7EEF4;
    --text-dim: #8595A3;
    --text-faint: #5C6875;
    --accent: #FFB020;
    --accent-dim: #7a5510;
    --owned: #46C463;
    --wishlist: #4DA3FF;
    --retired: #E5675C;
    --available: #46C463;
    --rc: #29E0D2;
    --seller: #A78BFA;
    --radius: 10px;
    --shadow: 0 1px 0 #ffffff08 inset, 0 8px 24px -12px #00000090;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background:
      radial-gradient(1200px 600px at 80% -10%, #1a2632 0%, transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: 'Saira', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 0 0 64px;
  }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }

  /* ---------- Header ---------- */
  header.masthead { padding: 34px 0 0; }
  .brand-row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .brand {
    font-family: 'Saira Condensed', sans-serif;
    font-weight: 700;
    font-size: 40px;
    letter-spacing: 0.5px;
    line-height: 0.95;
    text-transform: uppercase;
    margin: 0;
  }
  .brand em { color: var(--accent); font-style: normal; }
  .tagline {
    color: var(--text-dim);
    font-size: 13.5px;
    font-weight: 400;
    letter-spacing: 0.2px;
  }
  .checker {
    height: 6px; margin: 16px 0 22px; border-radius: 3px; overflow: hidden;
    background: repeating-linear-gradient(90deg, var(--surface-3) 0 10px, transparent 10px 20px);
    position: relative;
  }
  .checker::after {
    content: ""; position: absolute; inset: 0; width: 34%;
    background: repeating-linear-gradient(90deg, var(--accent) 0 10px, #0e0e0e 10px 20px);
    opacity: 0.9;
  }

  /* ---------- Telemetry ---------- */
  .telemetry {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 12px;
  }
  .gauge {
    background: linear-gradient(180deg, var(--surface-2), var(--surface));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 13px 14px 12px;
    box-shadow: var(--shadow);
  }
  .gauge .label {
    font-family: 'Saira Condensed', sans-serif;
    text-transform: uppercase; letter-spacing: 1px;
    font-size: 11px; font-weight: 600; color: var(--text-dim);
  }
  .gauge .value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 25px; font-weight: 700; margin-top: 3px; line-height: 1;
  }
  .gauge .sub { font-size: 11px; color: var(--text-faint); margin-top: 4px; font-family: 'JetBrains Mono', monospace; }
  .gauge.accent .value { color: var(--accent); }
  .gauge.owned .value { color: var(--owned); }
  .gauge.wish .value { color: var(--wishlist); }

  .cov-track { height: 5px; background: var(--surface-3); border-radius: 3px; margin-top: 7px; overflow: hidden; }
  .cov-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #ffce6b); border-radius: 3px; transition: width .4s ease; }

  /* ---------- Dynamic Theme Bar ---------- */
  .theme-bar { 
    display: grid; 
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); 
    gap: 10px; 
    margin-bottom: 24px; 
  }
  .theme-stat {
    display: flex; flex-direction: column; gap: 5px; text-align: left; cursor: pointer;
    background: linear-gradient(180deg, var(--surface-2), var(--surface));
    border: 1px solid var(--border); border-left: 3px solid var(--border);
    border-radius: var(--radius); padding: 10px 12px; font-family: 'Saira', sans-serif;
    transition: border-color .12s, transform .12s;
  }
  .theme-stat:hover { transform: translateY(-1px); border-color: var(--border-bright); }
  .theme-stat.active { background: var(--surface-3); border-color: var(--border-bright); }

  /* Theme Palette */
  .theme-stat.technic { border-left-color: #e08a3c; }
  .theme-stat.speed-champions { border-left-color: #4DA3FF; }
  .theme-stat.icons { border-left-color: #b57edc; }
  .theme-stat.architecture { border-left-color: #2DD4BF; }
  .theme-stat.batman { border-left-color: #FACC15; }
  .theme-stat.racers { border-left-color: #EF4444; }
  .theme-stat.jurassic-park { border-left-color: #22C55E; }
  .theme-stat.ideas { border-left-color: #F472B6; }
  .theme-stat.artworks { border-left-color: #38BDF8; }
  .theme-stat.other { border-left-color: var(--text-faint); }

  .ts-name {
    font-family: 'Saira Condensed', sans-serif; text-transform: uppercase; letter-spacing: 0.8px;
    font-size: 11px; font-weight: 700; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .theme-stat.technic .ts-name { color: #e08a3c; }
  .theme-stat.speed-champions .ts-name { color: #4DA3FF; }
  .theme-stat.icons .ts-name { color: #b57edc; }
  .theme-stat.architecture .ts-name { color: #2DD4BF; }
  .theme-stat.batman .ts-name { color: #FACC15; }
  .theme-stat.racers .ts-name { color: #EF4444; }
  .theme-stat.jurassic-park .ts-name { color: #22C55E; }
  .theme-stat.ideas .ts-name { color: #F472B6; }
  .theme-stat.artworks .ts-name { color: #38BDF8; }

  .ts-total { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; color: var(--text); line-height: 1; }
  .ts-sub { font-family: 'Saira', sans-serif; font-size: 11px; font-weight: 400; color: var(--text-faint); letter-spacing: 0; text-transform: none; margin-left: 4px; }

  /* ---------- Controls ---------- */
  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
  .search {
    flex: 1 1 220px; min-width: 180px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 12px; color: var(--text);
    font-family: 'Saira', sans-serif; font-size: 14px;
  }
  .search:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
  .search::placeholder { color: var(--text-faint); }

  select.ctl {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 9px 10px; font-family: 'Saira', sans-serif; font-size: 13.5px;
  }
  select.ctl:focus { outline: 2px solid var(--accent); }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    font-family: 'Saira Condensed', sans-serif; text-transform: uppercase; letter-spacing: 0.6px;
    font-size: 12.5px; font-weight: 600;
    background: var(--surface); border: 1px solid var(--border); color: var(--text-dim);
    padding: 8px 13px; border-radius: 999px; cursor: pointer; transition: all .12s;
  }
  .chip:hover { color: var(--text); border-color: var(--border-bright); }
  .chip.active { background: var(--accent); color: #16120a; border-color: var(--accent); }
  .chip.rc-toggle { display: inline-flex; align-items: center; gap: 5px; }
  .chip.rc-toggle svg { width: 12px; height: 12px; }
  .chip.rc-toggle.active { background: var(--rc); color: #06201f; border-color: var(--rc); }
  .rc-badge {
    position: absolute; top: 8px; left: 8px; z-index: 3;
    display: inline-flex; align-items: center; gap: 3px;
    font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 11px;
    letter-spacing: 0.8px; text-transform: uppercase;
    background: var(--rc); color: #06201f; padding: 3px 7px 3px 5px; border-radius: 5px;
    box-shadow: 0 2px 6px rgba(0,0,0,.35);
  }
  .rc-badge svg { width: 11px; height: 11px; }

  button.action {
    font-family: 'Saira Condensed', sans-serif; text-transform: uppercase; letter-spacing: 0.6px;
    font-size: 12.5px; font-weight: 700;
    background: var(--accent); color: #16120a; border: none;
    padding: 9px 15px; border-radius: 8px; cursor: pointer;
  }
  button.action:hover { filter: brightness(1.08); }
  .chip.buy-toggle svg { width: 13px; height: 13px; margin-right: 5px; vertical-align: -2px; }

  .bl-box { display: block; margin-top: 8px; border: 1px solid var(--border); border-radius: 8px;
            background: rgba(255,255,255,.02); overflow: hidden; text-decoration: none;
            transition: border-color .12s, background .12s; }
  a.bl-box:hover { border-color: var(--accent); background: rgba(255,255,255,.05); }
  a.bl-box:hover .bl-go { opacity: 1; transform: translateX(1px); }
  a.bl-box:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .bl-head { display: flex; align-items: baseline; gap: 7px; padding: 8px 11px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-dim); }
  .bl-head .bl-price { font-size: 13px; letter-spacing: 0; text-transform: none; font-weight: 600; color: var(--accent); margin-left: auto; }
  .bl-go { font-size: 12px; color: var(--accent); opacity: .8; transition: opacity .12s, transform .12s; }
  .bl-meta { padding: 0 11px 9px; font-size: 11px; color: var(--text-dim); line-height: 1.55; }
  .bl-seller { color: var(--text); font-weight: 500; }
  .bl-meta .bl-note { display: block; margin-top: 4px; font-style: italic; color: var(--text-faint); }
  .bl-stale { font-style: italic; opacity: .7; }
  .bl-save { display: inline-block; margin-top: 5px; padding: 1.5px 6px; border-radius: 4px;
             background: rgba(45,164,78,.14); color: var(--available, #3fb950);
             font-size: 10px; font-weight: 600; letter-spacing: .01em; }
  button.ghost {
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    font-family: 'Saira Condensed', sans-serif; text-transform: uppercase; letter-spacing: 0.6px;
    font-size: 12px; font-weight: 600; padding: 9px 13px; border-radius: 8px; cursor: pointer;
  }
  button.ghost:hover { color: var(--text); border-color: var(--border-bright); }
  .toolbar-right { display: flex; gap: 8px; margin-left: auto; }

  /* ---------- Cards ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .card {
    background: linear-gradient(180deg, var(--surface-2), var(--surface));
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 15px 15px 13px; position: relative; box-shadow: var(--shadow);
    transition: border-color .15s, transform .15s;
  }
  .card:hover { border-color: var(--border-bright); }
  .card[data-status="owned"] { border-left: 3px solid var(--owned); }
  .card[data-status="wishlist"] { border-left: 3px solid var(--wishlist); }

  .img-wrap {
    position: relative; margin: -15px -15px 13px; height: 158px;
    border-radius: var(--radius) var(--radius) 0 0; overflow: hidden;
    background: #f2f3f5;
    display: flex; align-items: center; justify-content: center;
  }
  .card[data-status="owned"] .img-wrap,
  .card[data-status="wishlist"] .img-wrap { margin-left: -15px; }
  .set-img {
    position: relative; z-index: 1; width: 100%; height: 100%;
    object-fit: contain; padding: 8px; display: block;
  }
  .img-ph {
    position: absolute; inset: 0; z-index: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px;
    background: repeating-linear-gradient(135deg, #12181f 0 14px, #151c24 14px 28px);
    color: var(--text-faint);
  }
  .img-ph svg { width: 42px; height: 42px; opacity: 0.5; }
  .img-ph .pn { font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 1px; }

  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .theme-tag {
    font-family: 'Saira Condensed', sans-serif; text-transform: uppercase; letter-spacing: 1px;
    font-size: 10.5px; font-weight: 700; color: var(--text-faint);
  }
  .theme-tag.technic { color: #e08a3c; }
  .theme-tag.speed-champions { color: #4DA3FF; }
  .theme-tag.icons { color: #b57edc; }
  .theme-tag.architecture { color: #2DD4BF; }
  .theme-tag.batman { color: #FACC15; }
  .theme-tag.racers { color: #EF4444; }
  .theme-tag.jurassic-park { color: #22C55E; }
  .theme-tag.ideas { color: #F472B6; }
  .theme-tag.artworks { color: #38BDF8; }

  .plate {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500;
    background: #0c1015; border: 1px solid var(--border); color: var(--text-dim);
    padding: 3px 7px; border-radius: 5px; letter-spacing: 0.5px; white-space: nowrap;
  }
  .set-name { font-size: 17px; font-weight: 600; margin: 9px 0 8px; line-height: 1.2; }
  .meta-row { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
  .meta { display: flex; flex-direction: column; gap: 1px; }
  .meta .k {
    font-family: 'Saira Condensed', sans-serif; text-transform: uppercase; letter-spacing: 0.8px;
    font-size: 9.5px; font-weight: 600; color: var(--text-faint);
  }
  .meta .v { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; }

  .prod {
    display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
    font-family: 'Saira Condensed', sans-serif; text-transform: uppercase; letter-spacing: 0.6px;
    font-size: 11px; font-weight: 600; border: none; background: transparent; padding: 0;
  }
  .prod .dot { width: 7px; height: 7px; border-radius: 50%; }
  .prod.available { color: var(--available); }
  .prod.available .dot { background: var(--available); box-shadow: 0 0 6px var(--available); }
  .prod.retired { color: var(--retired); }
  .prod.retired .dot { background: var(--retired); }
  .prod-note { font-size: 10.5px; color: var(--text-faint); font-family: 'Saira', sans-serif; font-weight: 400; text-transform: none; letter-spacing: 0; margin-left: 4px; }

  .seg { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; margin-top: 4px; }
  .seg button {
    font-family: 'Saira Condensed', sans-serif; text-transform: uppercase; letter-spacing: 0.5px;
    font-size: 11.5px; font-weight: 600; cursor: pointer;
    background: var(--surface-3); border: 1px solid transparent; color: var(--text-dim);
    padding: 7px 4px; border-radius: 6px; transition: all .12s;
  }
  .seg button:hover { color: var(--text); }
  .seg button[data-on="owned"] { background: var(--owned); color: #06210f; border-color: var(--owned); }
  .seg button[data-on="wishlist"] { background: var(--wishlist); color: #041426; border-color: var(--wishlist); }
  .seg button[data-on="missing"] { background: var(--surface-3); color: var(--text); border-color: var(--border-bright); }

  .detail { margin-top: 11px; padding-top: 11px; border-top: 1px dashed var(--border); display: none; gap: 8px; }
  .card[data-status="owned"] .detail,
  .card[data-status="wishlist"] .detail { display: flex; flex-direction: column; }
  .detail label { font-family: 'Saira Condensed', sans-serif; text-transform: uppercase; letter-spacing: 0.7px; font-size: 9.5px; font-weight: 600; color: var(--text-faint); display: block; margin-bottom: 3px; }
  .detail input, .detail textarea {
    width: 100%; background: #0c1015; border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 12.5px; padding: 6px 8px;
  }
  .detail textarea { font-family: 'Inter', sans-serif; resize: vertical; min-height: 34px; }
  .detail input:focus, .detail textarea:focus { outline: 1.5px solid var(--accent); border-color: transparent; }
  .price-wrap { position: relative; }
  .price-wrap .unit { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); color: var(--text-faint); font-family: 'JetBrains Mono', monospace; font-size: 11px; }

  .del-custom { position: absolute; bottom: 11px; right: 13px; background: none; border: none; color: var(--text-faint); font-size: 11px; cursor: pointer; font-family: 'Saira', sans-serif; }
  .del-custom:hover { color: var(--retired); }

  .empty { text-align: center; color: var(--text-dim); padding: 60px 20px; }
  .empty h3 { font-family: 'Saira Condensed', sans-serif; text-transform: uppercase; letter-spacing: 1px; color: var(--text); }

  /* ---------- Modal ---------- */
  .modal-bg { position: fixed; inset: 0; background: #05080bcc; display: none; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border-bright); border-radius: 14px;
    padding: 22px; width: 100%; max-width: 430px; box-shadow: 0 24px 60px -20px #000;
  }
  .modal h2 { font-family: 'Saira Condensed', sans-serif; text-transform: uppercase; letter-spacing: 1px; margin: 0 0 16px; font-size: 20px; }
  .field { margin-bottom: 12px; }
  .field label { font-family: 'Saira Condensed', sans-serif; text-transform: uppercase; letter-spacing: 0.7px; font-size: 10.5px; font-weight: 600; color: var(--text-dim); display: block; margin-bottom: 5px; }
  .field input, .field select {
    width: 100%; background: #0c1015; border: 1px solid var(--border); border-radius: 7px;
    color: var(--text); font-family: 'Saira', sans-serif; font-size: 14px; padding: 8px 10px;
  }
  .field input:focus, .field select:focus { outline: 1.5px solid var(--accent); border-color: transparent; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }

  .bs-wrap { position: relative; margin-bottom: 14px; }
  .bs-wrap input { width: 100%; background: #0c1015; border: 1px solid var(--border); border-radius: 7px; color: var(--text); font-family: 'Saira', sans-serif; font-size: 14px; padding: 8px 10px; }
  .bs-wrap input:focus { outline: 1.5px solid var(--accent); border-color: transparent; }
  .bs-hint { font-family: 'Saira Condensed', sans-serif; text-transform: uppercase; letter-spacing: 0.7px; font-size: 10.5px; font-weight: 600; color: var(--text-dim); display: block; margin-bottom: 5px; }
  .bs-results { position: absolute; left: 0; right: 0; top: calc(100% + 4px); background: #0c1015; border: 1px solid var(--border-bright); border-radius: 8px; max-height: 260px; overflow-y: auto; z-index: 70; box-shadow: 0 18px 40px -16px #000; display: none; }
  .bs-results.open { display: block; }
  .bs-item { padding: 8px 11px; cursor: pointer; border-bottom: 1px solid var(--border); display: flex; align-items: baseline; gap: 8px; }
  .bs-item:last-child { border-bottom: none; }
  .bs-item:hover, .bs-item.active { background: var(--accent-dim); }
  .bs-item .bs-num { font-family: 'Saira Condensed', sans-serif; font-weight: 700; color: var(--accent); font-size: 12px; min-width: 46px; }
  .bs-item .bs-name { font-size: 13px; color: var(--text); flex: 1; }
  .bs-item .bs-meta { font-size: 11px; color: var(--text-dim); white-space: nowrap; }

  .foot { margin-top: 28px; color: var(--text-faint); font-size: 12px; line-height: 1.6; }
  .foot code { font-family: 'JetBrains Mono', monospace; color: var(--text-dim); }

  @media (max-width: 860px) {
    .telemetry { grid-template-columns: repeat(3, 1fr); }
    .brand { font-size: 32px; }
  }
  @media (max-width: 520px) {
    .telemetry { grid-template-columns: repeat(2, 1fr); }
    .toolbar-right { margin-left: 0; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="masthead">
    <div class="brand-row">
      <h1 class="brand">Brick <em>Garage</em></h1>
      <span class="tagline">LEGO Collection Log · Technic · Speed Champions · Icons · Themes</span>
    </div>
    <div class="checker"></div>
  </header>

  <section class="telemetry" id="telemetry"></section>
  <section class="theme-bar" id="themeBar"></section>

  <div class="controls">
    <input class="search" id="search" placeholder="Search name or set number…" autocomplete="off">
    <div class="chips" id="statusChips">
      <button class="chip" data-status="all">All</button>
      <button class="chip" data-status="owned">Owned</button>
      <button class="chip" data-status="wishlist">Wishlist</button>
      <button class="chip active" data-status="missing">Missing</button>
    </div>
    <button class="chip rc-toggle" id="rcToggle" title="Show only CONTROL+ remote-controlled cars"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.5H11l-1 8L19.5 10H13z"/></svg>RC only</button>
    <select class="ctl" id="themeFilter">
      <option value="all">All themes</option>
      <option value="Technic">Technic</option>
      <option value="Speed Champions">Speed Champions</option>
      <option value="Icons">Icons</option>
      <option value="Architecture">Architecture</option>
      <option value="Batman">Batman</option>
      <option value="Racers">Racers</option>
      <option value="Jurassic Park">Jurassic Park</option>
      <option value="Ideas">Ideas</option>
      <option value="Artworks">Artworks</option>
      <option value="Other">Other</option>
    </select>
    <select class="ctl" id="sort">
      <option value="year-desc">Newest first</option>
      <option value="year-asc">Oldest first</option>
      <option value="pieces-desc">Pieces (most first)</option>
      <option value="pieces-asc">Pieces (fewest first)</option>
      <option value="name">Name A–Z</option>
      <option value="theme">Theme</option>
      <option value="status">Status</option>
    </select>
    <div class="toolbar-right">
      <button class="action" id="addBtn">+ Add set</button>
      <button class="ghost" id="exportBtn" title="Download your collection as JSON">Export</button>
      <button class="ghost" id="importBtn" title="Restore from a JSON backup">Import</button>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <p class="foot">
    Production status (<span style="color:var(--available)">●</span> Available / <span style="color:var(--retired)">●</span> Retired) updates live.
    Data persists automatically to local storage.
  </p>
</div>

<!-- Add-set modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2>Add a set</h2>
    <div class="bs-wrap">
      <label class="bs-hint" for="bs-search">Search Brickset — name or set number</label>
      <input id="bs-search" placeholder="e.g. 42115 or 21060" autocomplete="off">
      <div class="bs-results" id="bs-results"></div>
    </div>
    <div class="field">
      <label>Name</label>
      <input id="f-name" placeholder="e.g. Lamborghini Sián FKP 37">
    </div>
    <div class="field-row">
      <div class="field"><label>Set number</label><input id="f-num" placeholder="e.g. 42115"></div>
      <div class="field"><label>Year</label><input id="f-year" type="number" placeholder="2024"></div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Theme</label>
        <select id="f-theme">
          <option>Technic</option>
          <option>Speed Champions</option>
          <option>Icons</option>
          <option>Architecture</option>
          <option>Batman</option>
          <option>Racers</option>
          <option>Jurassic Park</option>
          <option>Ideas</option>
          <option>Artworks</option>
          <option>Other</option>
        </select>
      </div>
      <div class="field"><label>Pieces</label><input id="f-pieces" type="number" placeholder="optional"></div>
    </div>
    <div class="field">
      <label>Production status</label>
      <select id="f-prod"><option value="available">Available</option><option value="retired">Retired</option></select>
    </div>
    <div class="modal-actions">
      <button class="ghost" id="cancelBtn">Cancel</button>
      <button class="action" id="saveBtn">Add to garage</button>
    </div>
  </div>
</div>

<input type="file" id="importFile" accept="application/json" style="display:none">

<script>
const KEY = 'brick_garage_v1';
const CUR = 'kr'; // ISK

// -------------------------------------------------------------
// PRESERVE YOUR IMAGES OBJECT HERE
// Paste your existing IMAGES = { "10248": "data:image/jpeg;base64,...", ... };
// -------------------------------------------------------------
const IMAGES = window.IMAGES || {};

// -------------------------------------------------------------
// MASTER THEMES AND CATEGORIZATION ENGINE
// -------------------------------------------------------------
const THEMES = [
  "Technic",
  "Speed Champions",
  "Icons",
  "Architecture",
  "Batman",
  "Racers",
  "Jurassic Park",
  "Ideas",
  "Artworks",
  "Other"
];

function themeToClass(theme) {
  return (theme || "other").toLowerCase().replace(/[^a-z0-9]/g, "-");
}

// Smart Theme Resolver: Detects category via number ranges and keywords
function resolveTheme(item) {
  const num = parseInt(item.num || item.sku || item.item_no || 0, 10);
  const name = (item.name || "").toLowerCase();
  const currentTheme = (item.theme || "").trim();

  // If already assigned a recognized theme (other than Other), preserve it
  if (currentTheme && currentTheme !== "Other" && THEMES.includes(currentTheme)) {
    return currentTheme;
  }

  // 1. Batman / DC
  if (
    num === 7784 || num === 76139 || num === 40433 || num === 76240 || 
    num === 76328 || num === 76324 || name.includes("batman") || 
    name.includes("batmobile") || name.includes("tumbler") || name.includes("batwing")
  ) {
    return "Batman";
  }

  // 2. Jurassic Park / Jurassic World
  if (
    num === 75936 || num === 76956 || num === 76968 ||
    name.includes("jurassic") || name.includes("t. rex") || name.includes("t-rex") || name.includes("dinosaur")
  ) {
    return "Jurassic Park";
  }

  // 3. Architecture (210xx series + iconic skylines/monuments)
  if (
    (num >= 21000 && num < 21100) || num === 21020 || num === 21058 || 
    num === 21060 || num === 21061 || num === 21062 || num === 21063 || 
    num === 21067 || num === 21068 || name.includes("architecture") ||
    name.includes("himeji") || name.includes("notre-dame") || 
    name.includes("pyramid of giza") || name.includes("sagrada") || name.includes("neuschwanstein")
  ) {
    return "Architecture";
  }

  // 4. Vintage Racers & Shell V-Power Racers
  if (
    (num >= 8140 && num <= 8146) || (num >= 8650 && num <= 8680) || 
    (num >= 40190 && num <= 40196) || name.includes("1:10") || 
    name.includes("1:17") || name.includes("racers") ||
    name.includes("enzo ferrari") || name.includes("f430") || name.includes("599 gtb")
  ) {
    return "Racers";
  }

  // 5. Artworks (Van Gogh, Hokusai, Mosaics)
  if (
    num === 21333 || (num >= 31197 && num <= 31215) || 
    name.includes("starry night") || name.includes("van gogh") || name.includes("hokusai") || name.includes("great wave")
  ) {
    return "Artworks";
  }

  // 6. LEGO Ideas (213xx Series)
  if (
    (num >= 21300 && num < 21400) || name.includes("central perk") || 
    name.includes("seinfeld") || name.includes("home alone") || 
    name.includes("the office") || name.includes("wall-e") || 
    name.includes("yellow submarine") || name.includes("caterham") || 
    name.includes("typewriter") || name.includes("lighthouse") || 
    name.includes("godzilla") || name.includes("x-files") || name.includes("wallace & gromit")
  ) {
    return "Ideas";
  }

  // 7. Technic (42xxx series or Technic in name)
  if ((num >= 42000 && num <= 42999) || name.includes("technic")) {
    return "Technic";
  }

  // 8. Speed Champions (758xx, 768xx, 769xx)
  if ((num >= 75870 && num <= 75913) || (num >= 76895 && num <= 76935) || name.includes("speed champions")) {
    return "Speed Champions";
  }

  // 9. Icons / Creator Expert / BDP (10181, 10189, 102xx, 103xx, 910xxx)
  if (
    num === 10181 || num === 10189 || num === 910002 || 
    name.includes("taj mahal") || name.includes("eiffel tower") || 
    name.includes("studgate") || (num >= 10200 && num <= 10399)
  ) {
    return "Icons";
  }

  return "Other";
}

// -------------------------------------------------------------
// STATE & STORAGE
// -------------------------------------------------------------
let sets = [];
try {
  const raw = localStorage.getItem(KEY);
  if (raw) sets = JSON.parse(raw);
} catch (e) {
  sets = [];
}

// Automatic one-time migration: Resolve any "Other" or unassigned sets
let migrated = false;
sets.forEach(s => {
  if (!s.theme || s.theme === "Other") {
    const autoTheme = resolveTheme(s);
    if (autoTheme !== "Other") {
      s.theme = autoTheme;
      migrated = true;
    }
  }
});
if (migrated) {
  try { localStorage.setItem(KEY, JSON.stringify(sets)); } catch (e) {}
}

let activeStatusFilter = "missing";
let activeThemeFilter = "all";
let rcOnly = false;
let searchQuery = "";
let sortMode = "year-desc";

// -------------------------------------------------------------
// RENDERING
// -------------------------------------------------------------
function renderTelemetry() {
  const el = document.getElementById("telemetry");
  if (!el) return;

  const total = sets.length;
  const owned = sets.filter(s => s.status === "owned").length;
  const wish = sets.filter(s => s.status === "wishlist").length;
  const missing = sets.filter(s => s.status === "missing" || !s.status).length;
  const pct = total ? Math.round((owned / total) * 100) : 0;

  el.innerHTML = `
    <div class="gauge"><div class="label">Tracked</div><div class="value">${total}</div></div>
    <div class="gauge owned"><div class="label">Owned</div><div class="value">${owned}</div></div>
    <div class="gauge wish"><div class="label">Wishlist</div><div class="value">${wish}</div></div>
    <div class="gauge"><div class="label">Coverage</div><div class="value">${pct}%</div><div class="cov-track"><div class="cov-fill" style="width:${pct}%"></div></div></div>
    <div class="gauge accent"><div class="label">Missing</div><div class="value">${missing}</div></div>
    <div class="gauge"><div class="label">Themes</div><div class="value">${THEMES.length - 1}</div></div>
  `;
}

function renderThemeBar() {
  const el = document.getElementById("themeBar");
  if (!el) return;

  el.innerHTML = THEMES.map(theme => {
    const list = sets.filter(s => s.theme === theme);
    if (list.length === 0) return "";
    const owned = list.filter(s => s.status === "owned").length;
    const cls = themeToClass(theme);
    const active = (activeThemeFilter === theme) ? "active" : "";

    return `
      <div class="theme-stat ${cls} ${active}" onclick="selectTheme('${theme}')">
        <span class="ts-name">${theme}</span>
        <span class="ts-total">${list.length}<span class="ts-sub">${owned} owned</span></span>
      </div>
    `;
  }).join("");
}

function selectTheme(theme) {
  activeThemeFilter = (activeThemeFilter === theme) ? "all" : theme;
  document.getElementById("themeFilter").value = activeThemeFilter;
  renderThemeBar();
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById("grid");
  if (!grid) return;

  let filtered = sets.filter(s => {
    // Status
    if (activeStatusFilter !== "all") {
      const st = s.status || "missing";
      if (st !== activeStatusFilter) return false;
    }
    // Theme
    if (activeThemeFilter !== "all" && s.theme !== activeThemeFilter) return false;
    // RC
    if (rcOnly && !s.rc) return false;
    // Search
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      const matchName = (s.name || "").toLowerCase().includes(q);
      const matchNum = String(s.num || s.sku || "").includes(q);
      if (!matchName && !matchNum) return false;
    }
    return true;
  });

  // Sorting
  filtered.sort((a, b) => {
    if (sortMode === "year-desc") return (b.year || 0) - (a.year || 0);
    if (sortMode === "year-asc") return (a.year || 0) - (b.year || 0);
    if (sortMode === "pieces-desc") return (b.pieces || 0) - (a.pieces || 0);
    if (sortMode === "pieces-asc") return (a.pieces || 0) - (b.pieces || 0);
    if (sortMode === "name") return (a.name || "").localeCompare(b.name || "");
    if (sortMode === "theme") return (a.theme || "").localeCompare(b.theme || "");
    return 0;
  });

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty"><h3>No sets match your filters</h3></div>`;
    return;
  }

  grid.innerHTML = filtered.map(s => {
    const num = s.num || s.sku || "";
    const imgUrl = (IMAGES && IMAGES[num]) ? IMAGES[num] : null;
    const themeCls = themeToClass(s.theme);
    const st = s.status || "missing";

    return `
      <div class="card" data-status="${st}">
        ${s.rc ? `<div class="rc-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M13 2L4.5 13.5H11l-1 8L19.5 10H13z"/></svg>RC</div>` : ""}
        <div class="img-wrap">
          ${imgUrl ? `<img class="set-img" src="${imgUrl}" alt="${s.name}">` : `
            <div class="img-ph">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
              <span class="pn">#${num}</span>
            </div>
          `}
        </div>
        <div class="card-top">
          <span class="theme-tag ${themeCls}">${s.theme || "Other"}</span>
          <span class="plate">#${num}</span>
        </div>
        <div class="set-name">${s.name}</div>
        <div class="meta-row">
          <div class="meta"><span class="k">Year</span><span class="v">${s.year || "—"}</span></div>
          <div class="meta"><span class="k">Pieces</span><span class="v">${s.pieces || "—"}</span></div>
          <div class="meta">
            <span class="k">Status</span>
            <span class="prod ${s.prod === 'available' ? 'available' : 'retired'}">
              <span class="dot"></span>${s.prod === 'available' ? 'Available' : 'Retired'}
            </span>
          </div>
        </div>
        <div class="seg">
          <button data-on="${st === 'owned' ? 'owned' : ''}" onclick="setStatus('${num}', 'owned')">Owned</button>
          <button data-on="${st === 'wishlist' ? 'wishlist' : ''}" onclick="setStatus('${num}', 'wishlist')">Wishlist</button>
          <button data-on="${st === 'missing' ? 'missing' : ''}" onclick="setStatus('${num}', 'missing')">Missing</button>
        </div>
      </div>
    `;
  }).join("");
}

function setStatus(num, status) {
  const s = sets.find(item => String(item.num || item.sku) === String(num));
  if (s) {
    s.status = status;
    saveSets();
    renderTelemetry();
    renderThemeBar();
    renderGrid();
  }
}

function saveSets() {
  try {
    localStorage.setItem(KEY, JSON.stringify(sets));
  } catch (e) {
    console.error("Save failed:", e);
  }
}

// -------------------------------------------------------------
// SMART MODAL AUTO-DETECTION LISTENERS
// -------------------------------------------------------------
function autoDetectModalTheme() {
  const fNum = document.getElementById("f-num");
  const fName = document.getElementById("f-name");
  const fTheme = document.getElementById("f-theme");

  const detected = resolveTheme({
    num: fNum ? fNum.value : 0,
    name: fName ? fName.value : ""
  });

  if (fTheme && detected) {
    fTheme.value = detected;
  }
}

// Attach live auto-detection as the user types
document.getElementById("f-num").addEventListener("input", autoDetectModalTheme);
document.getElementById("f-name").addEventListener("input", autoDetectModalTheme);

// Setup controls
document.getElementById("statusChips").addEventListener("click", e => {
  if (e.target.classList.contains("chip")) {
    document.querySelectorAll("#statusChips .chip").forEach(c => c.classList.remove("active"));
    e.target.classList.add("active");
    activeStatusFilter = e.target.getAttribute("data-status");
    renderGrid();
  }
});

document.getElementById("rcToggle").addEventListener("click", e => {
  rcOnly = !rcOnly;
  e.currentTarget.classList.toggle("active", rcOnly);
  renderGrid();
});

document.getElementById("themeFilter").addEventListener("change", e => {
  activeThemeFilter = e.target.value;
  renderThemeBar();
  renderGrid();
});

document.getElementById("sort").addEventListener("change", e => {
  sortMode = e.target.value;
  renderGrid();
});

document.getElementById("search").addEventListener("input", e => {
  searchQuery = e.target.value;
  renderGrid();
});

// Modal Actions
const modalBg = document.getElementById("modalBg");
document.getElementById("addBtn").addEventListener("click", () => {
  modalBg.classList.add("open");
});
document.getElementById("cancelBtn").addEventListener("click", () => {
  modalBg.classList.remove("open");
});

document.getElementById("saveBtn").addEventListener("click", () => {
  const name = document.getElementById("f-name").value.trim();
  const num = document.getElementById("f-num").value.trim();
  const year = parseInt(document.getElementById("f-year").value, 10) || null;
  const pieces = parseInt(document.getElementById("f-pieces").value, 10) || null;
  const prod = document.getElementById("f-prod").value;
  let theme = document.getElementById("f-theme").value;

  if (!name || !num) {
    alert("Please enter a set name and number.");
    return;
  }

  // Fallback: If left as "Other", auto-resolve before saving
  if (theme === "Other") {
    theme = resolveTheme({ num, name });
  }

  const existing = sets.find(s => String(s.num || s.sku) === String(num));
  if (existing) {
    existing.name = name;
    existing.year = year;
    existing.pieces = pieces;
    existing.theme = theme;
    existing.prod = prod;
  } else {
    sets.unshift({
      num,
      name,
      year,
      pieces,
      theme,
      prod,
      status: "missing"
    });
  }

  saveSets();
  modalBg.classList.remove("open");
  renderTelemetry();
  renderThemeBar();
  renderGrid();
});

// Export / Import
document.getElementById("exportBtn").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(sets, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `brick_garage_backup_${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
});

document.getElementById("importBtn").addEventListener("click", () => {
  document.getElementById("importFile").click();
});

document.getElementById("importFile").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (Array.isArray(data)) {
        sets = data;
        // Auto-migrate on import
        sets.forEach(s => {
          if (!s.theme || s.theme === "Other") s.theme = resolveTheme(s);
        });
        saveSets();
        renderTelemetry();
        renderThemeBar();
        renderGrid();
      }
    } catch (err) {
      alert("Invalid JSON file.");
    }
  };
  reader.readAsText(file);
});

// Initial boot
renderTelemetry();
renderThemeBar();
renderGrid();
</script>
</body>
</html>
