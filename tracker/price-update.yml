name: Brick Garage price update

# Daily: scrape 7 retailers + BrickLink -> commit prices.json (the page reads it) AND
# diff against the previous prices.json to detect drops/sales/restocks/all-time-lows on
# your watched (missing) sets -> open a GitHub issue when something changes. Fully on
# GitHub. Sets marked Owned in the synced collection are skipped entirely.

on:
  schedule:
    - cron: '0 7 * * *'         # daily 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write               # commit prices.json + bricklink-ids.json
  issues: write                 # raise the price-drop issue

concurrency:
  group: price-update
  cancel-in-progress: true

jobs:
  prices:
    runs-on: ubuntu-latest
    # Raised from 20: BrickLink adds a lot fetch per set and Boozt now makes a second
    # (name-based) request on every miss. Run #51 hit the old 30-minute ceiling, so
    # this leaves headroom. BrickLink self-limits via PRICES_BL_BUDGET_MIN below, so
    # it can no longer be the thing that overruns.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Scrape prices + detect changes
        id: prices
        env:
          BG_SYNC_URL: ${{ secrets.BG_SYNC_URL }}         # Worker GET endpoint (returns synced blob; also supplies Owned status)
          BG_SYNC_KEY: ${{ secrets.BG_SYNC_KEY }}         # only if that route needs auth; leave unset otherwise
          BRICKSET_API_KEY: ${{ secrets.BRICKSET_API_KEY }} # production status (available/retired); unset = keep page seed
          # BrickLink fails ~58% of lot fetches from GitHub's egress while succeeding
          # reliably elsewhere. Failures are cheap now (~4.5s each), so attempt every
          # tracked set each run rather than a slice, and let the deadline cap it.
          PRICES_BL_PER_RUN: '150'                        # attempt all tracked sets
          PRICES_BL_BUDGET_MIN: '12'                      # hard stop for the BrickLink pass
          # PRICES_SKIP_BRICKLINK: '1'                    # uncomment to skip the marketplace pass
        run: node tracker/update-prices.mjs

      - name: Commit prices.json
        if: always()
        run: |
          set -euo pipefail
          # bricklink-ids.json is the set-number -> BrickLink itemid cache. itemids are
          # permanent, so committing it means each set is resolved once ever instead of
          # on every run (~145 avoidable requests a day).
          FILES="prices.json bricklink-ids.json"
          if git diff --quiet -- $FILES; then
            echo "No price changes."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $FILES
            git commit -m "Update prices ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Price-drop issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          COUNT="${{ steps.prices.outputs.alert_count }}"
          cat price-alerts.md >> "$GITHUB_STEP_SUMMARY" || true
          if [ "${COUNT:-0}" -gt 0 ]; then
            gh label create price-watch --color 2DA44E --description "Price drops & sales" --force || true
            for n in $(gh issue list --label price-watch --state open --json number --jq '.[].number'); do
              gh issue close "$n" --comment "Superseded by a newer price update." || true
            done
            gh issue create --title "💸 Price drops — $(date -u +%Y-%m-%d) (${COUNT})" \
              --label price-watch --body-file price-alerts.md
            echo "Opened price-drop issue (${COUNT} change(s))."
          else
            echo "No changes to alert."
          fi
